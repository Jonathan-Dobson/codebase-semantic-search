name: Publish

# Publishes to npm with trusted publishing (OIDC): npm accepts this workflow's
# GitHub identity directly, so there is no NPM_TOKEN to expire. Configured on
# npmjs.com → codebase-semantic-search → Settings → Trusted Publisher
# (GitHub Actions, Jonathan-Dobson/codebase-semantic-search, publish.yml).
#
# Runs on a v* tag push. To publish an existing tag again (for example after a
# failed run), dispatch it from main with that tag: the code comes from the
# tag, the workflow from main.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.3.0
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 20 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Check the tag matches package.json
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag $RELEASE_TAG but package.json says $PKG"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: npm exchanges this job's OIDC token for a
        # short-lived publish token, and signs provenance automatically.
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(.+)$ ]]; then
            TAG=$(echo "${BASH_REMATCH[1]}" | sed -E 's/\..*$//')
          else
            TAG=latest
          fi
          echo "Publishing $VERSION with dist-tag=$TAG"
          npm publish --provenance --tag "$TAG"

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
